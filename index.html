<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reset.css">
    <title>Pokedex - Menu</title>
</head>
<body>
    
    <div id="PopUpInfo">
        <div id="Screen">
            <button id="ButtonDeco" onclick="ClosePopUpInfo()">
            </button>
            <div id="ShowInfo">
                <div id="imagemPopUp" class="imagemPhone">
                    <img src="https://i.pinimg.com/736x/d3/5c/7d/d35c7d74032c0bdb54361e43a6112647.jpg"  alt="Personagem Bloqueado" style="height: 200px;width:200px;">
                </div>  
                <div id="pokeEntryPopUp"></div>
                            
                <div id="variantes_mega" style="display:none;">
                    <button onclick="expandirMegas()" class="botaoAdicional">
                        <img src="images/mega-removebg.png"  alt="Mega Evo" style="height: 100%;width:162%;border-radius: 100%; margin-left:-5px;">
                    </button>
                    <div id="ID_ListaDeMegas" class="CLASS_ListaDeMegas"></div>
                </div>
                <div id="ID_Dynamax" class="CLASS_Dynamax" style="display:none;"></div>

                <h1 id="pokemonNamePopUp">Nome</h1>
                <div id="typesPopUp" class="typesPhone" style="display: inline-flex;"></div>
                <div id="statusPopUp"></div>
                <div id="descricaoPopUp"></div>
                
            </div>
            <div id="ShowComparacao">
                <div id="CompararPokemon1">
                    <div id="imagemComparar1" class="imagemPhone">
                        <img src="https://i.pinimg.com/736x/d3/5c/7d/d35c7d74032c0bdb54361e43a6112647.jpg"  alt="Personagem Bloqueado" style="height: 200px;width:200px;">
                    </div>  
                    <div id="pokeEntryComparar1"></div>
                    <h1 id="pokemonNameComparar1">Nome</h1>
                    <div id="typesComparar1" style="display: inline-flex;"></div>
                    <div id="statusComparar1" class="statusPhone"></div>
                </div>

                <div id="CompararPokemon2">
                    <div id="imagemComparar2" class="imagemPhone">
                        <img src="https://i.pinimg.com/736x/d3/5c/7d/d35c7d74032c0bdb54361e43a6112647.jpg"  alt="Personagem Bloqueado" style="height: 200px;width:200px;">
                    </div>  
                    <div id="pokeEntryComparar2"></div>
                    <h1 id="pokemonNameComparar2">Nome</h1>
                    <div id="typesComparar2" style="display: inline-flex;"></div>
                    <div id="statusComparar2" class="statusPhone"></div>
                </div>
                
            </div>
            <button onclick="comparar()" id="Comparar">
                <img src="images/comparacao-removebg.png" alt="Comparar Pokemons" style="width: 40px;height: 45px;margin: -3px 0px 0px -9px;"></img>
            </button>
            
        </div>
        
    </div>

    
    <div class='Caixa_de_Alinhamento'>
        <button onclick="retroceder()"   class="paginaSelector" style="border-left: 2px solid black;border-radius: 10px 0 0 10px ;">◀</button>
        <input  type="number" id="pageN" class="paginaSelector" value="0" min="0" max="42" onfocusout="paginaIdentifier()" style="border-left: 1px solid rgba(128,128,128,0.35);border-right: 1px solid rgba(128,128,128,0.35);height: 69px;">
        <button onclick="avancar()"      class="paginaSelector" style="border-right: 2px solid black;border-radius: 0 10px 10px 0;">▶</button>
        

        
        <div id="Caixa_Filtro">
            <button id="Botao_Filtro_off" class="cabecalho_Filtros" onclick="filtros()">filtros</button>
            <div class="cabecalho_FiltroFill"></div>
            <input type="search" onsearch="buscaApi()" id='Pesquisa' class="cabecalho_Filtro2" name='Pesquisa' placeholder="🔎Pesquisar" maxlength="35" width="auto">
            <div class="cabecalho_FiltroFill2"></div>
        </div>
        
        
       

    </div>

    <div class="W_space2"></div>

    <div class='Caixa_de_Alinhamento' id='ajuste1'>
        <div id='Caixa_Pokemon' >
        </div>
    </div>

    <div id="CompararIcon" onclick="limparComparacao()">
        <img src="images/comparacao-removebg.png" alt="Comparar Pokemons" style="width: 40px;height: 45px;margin: -3px 0px 0px -9px;"></img>
    </div>
    
    <script src="js/cores.js"></script>
    <script src="main.js"></script>
</body>
</html>
